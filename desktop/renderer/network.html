<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'">
<title>네트워크 모드 · 사내망 AI</title><link rel="stylesheet" href="network.css"></head><body>
<h1>네트워크 모드</h1><p id="current"></p>
<form id="settings">
<label>실행 모드<select id="mode"><option value="normal">일반 · 기존 비서와 외부 연결</option><option value="offline">오프라인 펫 · 네트워크 연결 없음</option><option value="intranet">사내망 AI · 지정한 내부 모델에만 연결</option></select></label>
<div id="server">
<label>서버 API 주소<input id="endpoint" placeholder="http://127.0.0.1:11434/v1" maxlength="2048"></label>
<p>Chat Completions 호환 서버의 API 기본 주소입니다. localhost 또는 사설 IP만 허용합니다. 사내 서버는 HTTPS를 권장합니다. HTTP는 키와 대화가 암호화되지 않습니다.</p>
<label>모델 이름<input id="model" placeholder="서버에 설치된 모델 이름" maxlength="200"></label>
<label>API 키 (선택)<input id="key" type="password" autocomplete="off" maxlength="4096" placeholder="빈칸이면 기존 키 유지"></label>
<label><input type="checkbox" id="clear-key"> 저장된 키 삭제</label><p id="key-status"></p>
</div>
<p>저장하면 앱이 재시작됩니다. 제한 모드에서는 기존 비서 데몬·외부 연동·업데이트 확인을 실행하지 않습니다. 일반 모드로 돌아가면 기존 설정을 다시 사용합니다.</p>
<button type="submit">저장하고 재시작</button></form>
<p id="status" role="status"></p>
<section id="chat" hidden><h2>사내망 AI 대화</h2><p>현재 저장된 서버로만 전송합니다. 실패해도 외부 모델로 전환하지 않습니다. 대화는 창을 닫으면 지워집니다.</p>
<div id="messages" aria-live="polite"></div><form id="ask"><label>메시지<textarea id="prompt" maxlength="8000" required></textarea></label><button id="send">보내기</button><button type="button" id="reset">새 대화</button></form></section>
<script src="network.js" type="module"></script></body></html>
